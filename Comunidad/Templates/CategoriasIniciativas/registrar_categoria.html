{% extends 'Components/navbar.html' %}

{% block title %}Registrar Categoria{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <h1>Registrar Categoría</h1>

            <div class="card card-morada">
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data" class="form-morado">
                        {% csrf_token %}

                        {{ formulario.as_p }}

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn-morado">
                                Guardar
                            </button>
                            <a href="{% url 'listado_categorias' %}" class="btn-morado-suave">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
