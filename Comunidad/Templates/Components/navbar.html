<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
    <title>{% block title %}Gestión de Vitrinas de Comunidades de Mujeres STEM{% endblock %}</title>
</head>

<body>
    <div class="container mt-4">

        <nav class="navbar md:navbar-expand bg-accent" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="https://pascualbravo.edu.co/wp-content/uploads/2019/12/cropped-Institucion_Pascual_Bravo_Logo.png"
                        alt="Logo" width="170" height="45" class="d-inline-block align-text-top">
                </a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarDarkDrawer" aria-controls="navbarDarkDrawer" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarDarkDrawer"
                    aria-labelledby="navbarDarkDrawerLabel">

                    <div class="drawer-body mb-2 md:mb-0">
                        <ul class="nav navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="{% url 'listado_paises' %}">Paises</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="{% url 'listado_categorias' %}">Categorias</a>
                            </li>
                            <li class="nav-item align-items-center">
                                <a href="{% url 'listado_miembros' %}" class="nav-link pe-1">
                                    Miembros
                                </a>
                                <button class="nav-link ps-1" type="button" data-bs-toggle="menu" aria-expanded="false" aria-label="Opciones de Miembros">
                                    ▾
                                </button>

                                <div class="menu">
                                    <a class="menu-item" href="#">Miembros Iniciativa</a>
                                    <a class="menu-item" href="#">Miembros Evento</a>
                                </div>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'listado_ciudades' %}">Ciudades</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'listado_iniciativas' %}">Iniciativas</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'listado_eventos' %}">Eventos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'listado_sedes' %}">Sedes</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'listado_redes_sociales' %}">Redes Sociales</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Galerias Eventos</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Iniciativa Evento</a>
                            </li>

                        </ul>

                    </div>
                </dialog>
            </div>
        </nav>
        <br>

        {% block content %}
        {% endblock %}

    </div>
</body>

</html>
